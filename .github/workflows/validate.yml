name: Validate plugin

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@499d2b5c0b9d4e38681a8604b0a3c5b6b3f69b7a # v4
        with:
          node-version: "20"
      - run: python3 -m json.tool manifest.json >/dev/null
      - run: bash -n install.sh uninstall.sh install-omarchy.sh install-kait2en.sh
      - run: npm ci --no-audit --no-fund
      - run: npm run build